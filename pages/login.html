<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – my book.</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8f5ef;
      --ink: #26231f;
      --muted: #7d766c;
      --accent: #a9503c;
      --line: #e3ddd2;
      --bs-body-bg: var(--bg);
      --bs-body-color: var(--ink);
      --bs-body-font-family: 'Inter', system-ui, sans-serif;
    }
    body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }

    .brand { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1.7rem; letter-spacing: -.03em; color: var(--ink); text-decoration: none; }
    .brand span { color: var(--accent); }
    .topbar { padding: 1.1rem 0; border-bottom: 1px solid var(--line); }

    .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem; }
    .login-card { width: 100%; max-width: 420px; }
    .login-card h1 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 2.4rem; letter-spacing: -.03em; line-height: 1.1; }
    .login-card h1 em { color: var(--accent); }
    .sub { font-family: 'Playfair Display', serif; color: var(--muted); font-size: 1.05rem; margin: .8rem 0 2rem; }

    .form-label { font-size: .8rem; font-weight: 600; }
    .form-control {
      background: #fffdf9; border: 1px solid var(--line); border-radius: 2px;
      padding: .75rem .9rem; font-size: .92rem;
    }
    .form-control:focus { border-color: var(--ink); box-shadow: none; background: #fff; }
    .form-control.is-invalid { border-color: var(--accent); background-image: none; }
    .invalid-feedback { color: var(--accent); font-size: .78rem; }
    .toggle-pw { position: absolute; right: .6rem; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); }
    .form-check-input:checked { background-color: var(--ink); border-color: var(--ink); }
    .form-check-label, .small-link { font-size: .82rem; color: var(--muted); }
    .small-link { text-decoration: none; border-bottom: 1px solid var(--line); }
    .small-link:hover { color: var(--accent); border-color: var(--accent); }

    .btn-ink {
      background: var(--ink); color: #fff; border: 0; border-radius: 2px;
      font-size: .88rem; font-weight: 600; padding: .85rem 1.4rem; width: 100%;
    }
    .btn-ink:hover, .btn-ink:focus-visible { background: #000; color: #fff; }
    .alert-ok { background: #eef3e8; border: 1px solid #cfdcc3; color: #3f5a2c; border-radius: 2px; font-size: .85rem; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="container-xl px-4 d-flex justify-content-between align-items-center">
      <a href="../landing_page.html" class="brand">my book<span>.</span></a>
      <a href="../landing_page.html" class="small-link"><i class="bi bi-arrow-left"></i> Back to home</a>
    </div>
  </div>

  <main class="login-wrap">
    <div class="login-card">
      <h1>Welcome back to your <em>library.</em></h1>
      <p class="sub">Log in to create and keep your books.</p>

      <div id="msg" class="alert-ok p-3 mb-3 d-none" role="status"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="position-relative">
            <input type="password" class="form-control pe-5" id="password" placeholder="Your password" autocomplete="current-password" required minlength="6">
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password"><i class="bi bi-eye"></i></button>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="#" class="small-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-ink">Log in</button>
      </form>

      <p class="text-center mt-4 mb-0 form-check-label">
        New here? <a href="#" class="small-link">Create an account</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const msg = document.getElementById('msg');

    // Show / hide password
    document.getElementById('togglePw').addEventListener('click', e => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      e.currentTarget.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });

    // Front-end validation (replace the success part with your real login request)
    form.addEventListener('submit', e => {
      e.preventDefault();
      const okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
      const okPass = password.value.length >= 6;
      email.classList.toggle('is-invalid', !okEmail);
      password.classList.toggle('is-invalid', !okPass);
      if (okEmail && okPass) {
        msg.textContent = 'Login successful. Redirecting to your library…';
        msg.classList.remove('d-none');
        // window.location.href = 'library.html';  // your next page
      }
    });
  </script>
</body>
</html>
